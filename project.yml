name: PersonalFinanceApp
options:
  bundleIdPrefix: vn.finsmart
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"

targets:
  PersonalFinanceApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - "iPhoneWebApp/**"
          - "AppStoreSubmission/**"
          - "UploadGitHub/**"
          - "*.bat"
          - "*.md"
          - "codemagic.yaml"
          - "project.yml"
          - "Info.plist"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: vn.finsmart.personalfinance
        PRODUCT_NAME: PersonalFinanceApp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
