<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FinSmart Pro" />
  <title>FinSmart Pro - Quản lý Tài chính & Sổ Nợ</title>
  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --secondary: #E5E5EA;
      --text: #1C1C1E;
      --muted: #6C6C70;
      --border: #D1D1D6;
      --green: #10B981;
      --red: #EF4444;
      --blue: #007AFF;
      --amber: #F59E0B;
      --purple: #8B5CF6;
      --teal: #14B8A6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 12px;
      padding-bottom: 90px;
    }
    .app-shell {
      max-width: 440px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }
    .top-bar {
      padding: 14px 16px;
      background: var(--card);
      border-bottom: 1px solid var(--border);
    }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .row-start { display: flex; align-items: center; gap: 10px; }
    .wallet-select {
      font-size: 15px;
      font-weight: 700;
      border: none;
      background: transparent;
      color: var(--text);
      outline: none;
      cursor: pointer;
    }
    .btn {
      border: none;
      border-radius: 99px;
      padding: 7px 13px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-green { background: var(--green); color: #fff; }
    .btn-amber { background: #FEF3C7; color: #D97706; border: 1px solid #FCD34D; }
    .btn-blue { background: var(--blue); color: #fff; }
    .toolbar-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .tool-btn {
      border: 1px solid var(--border);
      background: var(--bg);
      border-radius: 12px;
      padding: 8px 4px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      color: var(--text);
    }
    .toast {
      margin: 10px 14px 0;
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      display: none;
      align-items: center;
      justify-content: space-between;
    }
    .toast.show { display: flex; }
    .content { padding: 14px; min-height: 480px; }
    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 13px;
      margin-bottom: 10px;
    }
    .vip-banner {
      background: linear-gradient(135deg, #F59E0B, #EA580C);
      color: #000;
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .tx-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 8px;
    }
    .icon-circle {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .progress-bar {
      width: 100%;
      height: 8px;
      background: var(--secondary);
      border-radius: 99px;
      overflow: hidden;
      margin: 8px 0;
    }
    .progress-fill { height: 100%; background: var(--green); border-radius: 99px; }
    .modal-box {
      border-top: 1px solid var(--border);
      background: var(--bg);
      padding: 14px;
      display: none;
    }
    .modal-box.show { display: block; }
    .input, .select {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 13px;
      margin-bottom: 8px;
    }
    .tab-bar {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      border-top: 1px solid var(--border);
      background: var(--card);
      padding: 8px 4px;
    }
    .tab-item {
      border: none;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      cursor: pointer;
      gap: 2px;
    }
    .tab-item.active { color: var(--green); font-weight: 700; }
    .text-sm { font-size: 14px; }
    .text-xs { font-size: 12px; }
    .muted { color: var(--muted); }
    .bold { font-weight: 700; }
    .green { color: var(--green); }
    .red { color: var(--red); }
    .amber { color: var(--amber); }
    .teal { color: var(--teal); }
  </style>
</head>
<body>

  <div class="app-shell">
    <!-- Top Header -->
    <div class="top-bar">
      <div class="row-between">
        <div class="row-start">
          <span style="font-size:20px;">👛</span>
          <div>
            <div class="text-xs muted">Ví đang chọn</div>
            <select id="globalWalletSelect" class="wallet-select" onchange="selectedWalletId=this.value;render()"></select>
          </div>
        </div>
        <div class="row-start">
          <button class="btn btn-amber" id="headerCrownBtn" onclick="openPaywallModal()">👑 PRO</button>
          <button class="btn btn-green" onclick="openTxModal()">+ Ghi chép</button>
        </div>
      </div>

      <!-- Quick Money Lover Pro Toolbar -->
      <div class="toolbar-3">
        <button class="tool-btn" onclick="openOCRModal()">📸 Quét HĐ AI</button>
        <button class="tool-btn" onclick="openSplitBillModal()">🍕 Chia tiền nhóm</button>
        <button class="tool-btn" onclick="openAdjustBalanceModal()">⚖️ Chỉnh số dư</button>
      </div>
    </div>

    <!-- Notification Toast -->
    <div id="toastBox" class="toast">
      <span id="toastText">Thông báo</span>
      <span style="cursor:pointer;" onclick="hideToast()">✕</span>
    </div>

    <!-- Main View Content -->
    <div id="viewContainer" class="content"></div>

    <!-- Modal Drawer -->
    <div id="modalContainer" class="modal-box"></div>

    <!-- Bottom Tab Bar -->
    <div class="tab-bar">
      <button id="tab_dashboard" class="tab-item active" onclick="switchTab('dashboard')">
        <span style="font-size:18px;">📒</span><span>Sổ thu chi</span>
      </button>
      <button id="tab_budget" class="tab-item" onclick="switchTab('budget')">
        <span style="font-size:18px;">🎯</span><span>Ngân sách</span>
      </button>
      <button id="tab_debt" class="tab-item" onclick="switchTab('debt')">
        <span style="font-size:18px;">🤝</span><span>Sổ nợ</span>
      </button>
      <button id="tab_events" class="tab-item" onclick="switchTab('events')">
        <span style="font-size:18px;">✈️</span><span>Sự kiện</span>
      </button>
      <button id="tab_analytics" class="tab-item" onclick="switchTab('analytics')">
        <span style="font-size:18px;">👑</span><span>Ví & VIP</span>
      </button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'FINSMART_STANDALONE_V3';
    const initialSeed = {
      isPro: false,
      selectedPlan: 'LIFETIME',
      accounts: [
        { id: 'acc1', name: 'Tiền mặt', type: 'Tiền mặt', balance: 2500000, icon: '💵', excludeFromTotal: false },
        { id: 'acc2', name: 'Techcombank', type: 'Ngân hàng', balance: 15000000, icon: '🏦', excludeFromTotal: false }
      ],
      categories: [
        { id: 'cat1', name: 'Ăn uống', icon: '🍜', isIncome: false },
        { id: 'cat2', name: 'Di chuyển', icon: '🚗', isIncome: false },
        { id: 'cat3', name: 'Hóa đơn & Điện nước', icon: '⚡', isIncome: false },
        { id: 'cat4', name: 'Mua sắm & Giải trí', icon: '🛍️', isIncome: false },
        { id: 'cat5', name: 'Du lịch & Sự kiện', icon: '🏖️', isIncome: false },
        { id: 'cat6', name: 'Tiền lương', icon: '💼', isIncome: true }
      ],
      events: [
        { id: 'ev1', name: 'Chuyến đi Đà Nẵng', icon: '✈️', budget: 8000000 }
      ],
      bills: [
        { id: 'bill1', title: 'Tiền Điện & Internet FPT', amount: 1150000, dueDay: 28, categoryId: 'cat3', accountId: 'acc2', paidThisMonth: false }
      ],
      transactions: [
        { id: 'tx1', amount: 18000000, type: 'INCOME', date: '2026-10-25', note: 'Lương tháng 10', categoryId: 'cat6', sourceAccountId: 'acc2', eventId: '' },
        { id: 'tx2', amount: 1650000, type: 'EXPENSE', date: '2026-10-25', note: 'Vé máy bay khứ hồi', categoryId: 'cat5', sourceAccountId: 'acc2', eventId: 'ev1' },
        { id: 'tx3', amount: 450000, type: 'EXPENSE', date: '2026-10-25', note: 'Lẩu nướng cuối tuần', categoryId: 'cat1', sourceAccountId: 'acc1', eventId: '' }
      ],
      budgets: [
        { id: 'b1', categoryId: 'cat1', limit: 4000000 },
        { id: 'b2', categoryId: 'cat4', limit: 3000000 }
      ],
      debts: [
        { id: 'd1', person: 'Nguyễn Văn A', type: 'LENT', total: 5000000, paid: 2000000, due: '2026-11-20', note: 'Cho mượn xoay sở công việc', settled: false },
        { id: 'd2', person: 'Trả góp Thẻ tín dụng', type: 'BORROWED', total: 12000000, paid: 4000000, due: '2026-11-25', note: 'Mua Macbook trả góp', settled: false }
      ]
    };

    function loadData() {
      try {
        const s = localStorage.getItem(STORAGE_KEY);
        return s ? JSON.parse(s) : JSON.parse(JSON.stringify(initialSeed));
      } catch (e) {
        return JSON.parse(JSON.stringify(initialSeed));
      }
    }
    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    let state = loadData();
    let activeTab = 'dashboard';
    let selectedWalletId = 'ALL';

    function vnd(n) {
      return new Intl.NumberFormat('vi-VN').format(Math.round(n || 0)) + ' ₫';
    }
    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastText').textContent = msg;
      box.classList.add('show');
      setTimeout(() => box.classList.remove('show'), 3500);
    }
    function hideToast() { document.getElementById('toastBox').classList.remove('show'); }

    function closeModal() {
      const m = document.getElementById('modalContainer');
      m.classList.remove('show');
      m.innerHTML = '';
    }

    function switchTab(tab) {
      activeTab = tab;
      closeModal();
      ['dashboard', 'budget', 'debt', 'events', 'analytics'].forEach(t => {
        const el = document.getElementById('tab_' + t);
        el.className = t === tab ? 'tab-item active' : 'tab-item';
      });
      render();
    }

    function render() {
      saveData();
      const sel = document.getElementById('globalWalletSelect');
      const total = state.accounts.filter(a => !a.excludeFromTotal).reduce((s, a) => s + Number(a.balance), 0);
      sel.innerHTML = `<option value="ALL" ${selectedWalletId==='ALL'?'selected':''}>Tất cả ví (${vnd(total)})</option>` +
        state.accounts.map(a => `<option value="${a.id}" ${selectedWalletId===a.id?'selected':''}>${a.icon} ${a.name} (${vnd(a.balance)})</option>`).join('');

      document.getElementById('headerCrownBtn').textContent = state.isPro ? '👑 VIP' : '👑 Nâng cấp';

      const c = document.getElementById('viewContainer');
      if (activeTab === 'dashboard') c.innerHTML = viewDashboard();
      else if (activeTab === 'budget') c.innerHTML = viewBudget();
      else if (activeTab === 'debt') c.innerHTML = viewDebt();
      else if (activeTab === 'events') c.innerHTML = viewEvents();
      else if (activeTab === 'analytics') c.innerHTML = viewVIP();
    }

    function viewDashboard() {
      const list = state.transactions.filter(t => selectedWalletId === 'ALL' || t.sourceAccountId === selectedWalletId);
      const inc = list.filter(t => t.type === 'INCOME').reduce((s, t) => s + Number(t.amount), 0);
      const exp = list.filter(t => t.type === 'EXPENSE').reduce((s, t) => s + Number(t.amount), 0);
      const net = inc - exp;

      return `
        ${!state.isPro ? `
          <div class="vip-banner" onclick="openPaywallModal()">
            <div>
              <div class="text-xs bold">👑 MỞ KHÓA FINSMART PRO TRỌN ĐỜI</div>
              <div class="text-xs">Không giới hạn Ví, Quét HĐ AI & Chia tiền nhóm</div>
            </div>
            <span class="btn" style="background:#000;color:#FBBF24;">399k</span>
          </div>
        ` : ''}

        <div class="card">
          <div class="row-between text-xs" style="margin-bottom:6px;"><span class="muted">Tiền vào tháng này</span><span class="bold green">+${vnd(inc)}</span></div>
          <div class="row-between text-xs" style="margin-bottom:6px;"><span class="muted">Tiền ra tháng này</span><span class="bold red">-${vnd(exp)}</span></div>
          <div class="row-between text-sm bold" style="border-top:1px solid var(--border);padding-top:6px;">
            <span>Dòng tiền ròng</span>
            <span class="${net>=0?'green':'red'}">${net>=0?'+':''}${vnd(net)}</span>
          </div>
        </div>

        ${list.map(tx => {
          const cat = state.categories.find(c => c.id === tx.categoryId);
          const src = state.accounts.find(a => a.id === tx.sourceAccountId);
          const isInc = tx.type === 'INCOME';
          return `
            <div class="tx-row">
              <div class="row-start">
                <div class="icon-circle">${cat ? cat.icon : '💸'}</div>
                <div>
                  <div class="text-sm bold">${cat ? cat.name : 'Giao dịch'}</div>
                  <div class="text-xs muted">${src ? src.name : ''} ${tx.note ? '• ' + tx.note : ''}</div>
                </div>
              </div>
              <div class="row-start">
                <span class="text-sm bold ${isInc?'green':'red'}">${isInc?'+':'-'}${vnd(tx.amount)}</span>
                <span style="cursor:pointer;color:#999;padding-left:6px;" onclick="deleteTx('${tx.id}')">✕</span>
              </div>
            </div>
          `;
        }).join('')}
      `;
    }

    function viewBudget() {
      return state.budgets.map(b => {
        const cat = state.categories.find(c => c.id === b.categoryId);
        const spent = state.transactions.filter(t => t.type === 'EXPENSE' && t.categoryId === b.categoryId).reduce((s, t) => s + Number(t.amount), 0);
        const pct = b.limit > 0 ? Math.min(100, Math.round((spent / b.limit) * 100)) : 0;
        return `
          <div class="card">
            <div class="row-between text-sm bold">
              <span>${cat ? cat.icon + ' ' + cat.name : 'Ngân sách'}</span>
              <span>${pct}%</span>
            </div>
            <div class="progress-bar"><div class="progress-fill" style="width:${pct}%;background:${pct>=100?'var(--red)':'var(--green)'}"></div></div>
            <div class="row-between text-xs muted">
              <span>Đã chi: ${vnd(spent)}</span>
              <span>Hạn mức: <strong style="color:var(--text)">${vnd(b.limit)}</strong></span>
            </div>
          </div>
        `;
      }).join('');
    }

    function viewDebt() {
      const rec = state.debts.filter(d => d.type === 'LENT' && !d.settled).reduce((s, d) => s + (d.total - d.paid), 0);
      const pay = state.debts.filter(d => d.type === 'BORROWED' && !d.settled).reduce((s, d) => s + (d.total - d.paid), 0);
      return `
        <div class="grid-2">
          <div class="card" style="margin:0;"><div class="text-xs bold teal">↗ Cần thu (Cho vay)</div><div class="text-sm bold" style="margin-top:4px;">${vnd(rec)}</div></div>
          <div class="card" style="margin:0;"><div class="text-xs bold amber">↙ Phải trả (Đi vay)</div><div class="text-sm bold" style="margin-top:4px;">${vnd(pay)}</div></div>
        </div>
        ${state.debts.map(d => {
          const rem = Math.max(0, d.total - d.paid);
          const pct = d.total > 0 ? Math.round((d.paid / d.total) * 100) : 100;
          return `
            <div class="card">
              <div class="row-between">
                <div>
                  <span class="text-sm bold">${d.person}</span>
                  <div class="text-xs muted">${d.note || ''}</div>
                </div>
                <div style="text-align:right;">
                  <div class="text-sm bold">${vnd(rem)}</div>
                  <div class="text-xs muted">Gốc: ${vnd(d.total)}</div>
                </div>
              </div>
              <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
              <div class="row-between text-xs">
                <span class="muted">📅 Hạn: ${d.due}</span>
                ${d.settled ? `<span class="bold green">✓ Đã tất toán</span>` : `<button class="btn btn-green" onclick="settleDebt('${d.id}')">${d.type==='LENT'?'Thu hết nợ':'Trả hết nợ'}</button>`}
              </div>
            </div>
          `;
        }).join('')}
        <button class="btn btn-blue" style="width:100%;padding:11px;" onclick="openDebtModal()">+ Thêm khoản Vay / Cho vay</button>
      `;
    }

    function viewEvents() {
      return `
        <div class="text-xs bold muted" style="margin-bottom:8px;">✈️ SỰ KIỆN & DU LỊCH</div>
        ${state.events.map(ev => {
          const spent = state.transactions.filter(t => t.type === 'EXPENSE' && t.eventId === ev.id).reduce((s, t) => s + Number(t.amount), 0);
          return `
            <div class="card row-between">
              <span class="text-sm bold">${ev.icon} ${ev.name}</span>
              <span class="text-sm bold red">${vnd(spent)}</span>
            </div>
          `;
        }).join('')}
        <div class="text-xs bold muted" style="margin:12px 0 8px;">🧾 HÓA ĐƠN ĐỊNH KỲ HÀNG THÁNG</div>
        ${state.bills.map(b => `
          <div class="card row-between">
            <div>
              <div class="text-sm bold">${b.title}</div>
              <div class="text-sm bold red">${vnd(b.amount)}</div>
            </div>
            ${b.paidThisMonth ? `<span class="text-xs bold green">✓ Đã trả</span>` : `<button class="btn btn-green" onclick="payBill('${b.id}')">Trả ngay</button>`}
          </div>
        `).join('')}
      `;
    }

    function viewVIP() {
      return `
        <div class="card" style="background:#1E3C72;color:#fff;">
          <div class="text-sm bold">👑 ${state.isPro ? 'FinSmart Pro VIP (Đã mở khóa)' : 'FinSmart Bản Miễn Phí (Free)'}</div>
          <div class="text-xs" style="opacity:0.85;margin:4px 0 10px;">${state.isPro ? 'Đã kích hoạt trọn đời không giới hạn' : 'Giới hạn 2 Ví. Nâng cấp để mở khóa toàn bộ.'}</div>
          ${!state.isPro ? `<button class="btn" style="background:#FBBF24;color:#000;width:100%;padding:10px;" onclick="openPaywallModal()">Mở Bảng Giá Nâng Cấp Pro</button>` : ''}
        </div>
        <div class="row-between" style="margin:10px 0 6px;">
          <span class="text-xs bold muted">DANH SÁCH VÍ (${state.accounts.length})</span>
          <button class="btn btn-blue" onclick="tryAddWallet()">+ Thêm Ví</button>
        </div>
        ${state.accounts.map(a => `
          <div class="tx-row">
            <span class="text-sm bold">${a.icon} ${a.name}</span>
            <span class="text-sm bold">${vnd(a.balance)}</span>
          </div>
        `).join('')}
      `;
    }

    // MODALS
    function openTxModal() {
      const m = document.getElementById('modalContainer');
      m.classList.add('show');
      m.innerHTML = `
        <div class="row-between" style="margin-bottom:8px;"><span class="text-sm bold">Thêm Giao Dịch Mới</span><span style="cursor:pointer;" onclick="closeModal()">✕</span></div>
        <select id="m_type" class="select"><option value="EXPENSE">Khoản chi (-)</option><option value="INCOME">Khoản thu (+)</option></select>
        <input id="m_amt" type="number" class="input" placeholder="Nhập số tiền (VND)" />
        <select id="m_cat" class="select">${state.categories.map(c => `<option value="${c.id}">${c.icon} ${c.name}</option>`).join('')}</select>
        <input id="m_note" type="text" class="input" placeholder="Ghi chú giao dịch..." />
        <button class="btn btn-green" style="width:100%;padding:10px;" onclick="saveTx()">Lưu Vào Sổ</button>
      `;
    }
    function saveTx() {
      const type = document.getElementById('m_type').value;
      const amt = Number(document.getElementById('m_amt').value);
      const catId = document.getElementById('m_cat').value;
      const note = document.getElementById('m_note').value.trim();
      if (!amt || amt <= 0) return showToast('Vui lòng nhập số tiền lớn hơn 0!');
      state.accounts[0].balance += (type === 'INCOME' ? amt : -amt);
      state.transactions.unshift({ id: 'tx_' + Date.now(), amount: amt, type, date: '2026-10-25', note, categoryId: catId, sourceAccountId: state.accounts[0].id, eventId: '' });
      closeModal();
      render();
      showToast('Đã lưu giao dịch thành công!');
    }
    function deleteTx(id) {
      state.transactions = state.transactions.filter(t => t.id !== id);
      render();
    }

    function openPaywallModal() {
      const m = document.getElementById('modalContainer');
      m.classList.add('show');
      m.innerHTML = `
        <div class="row-between" style="margin-bottom:8px;"><span class="text-sm bold">👑 Nâng cấp FinSmart Pro VIP</span><span style="cursor:pointer;" onclick="closeModal()">✕</span></div>
        <div class="card text-xs">
          <div>• Gói Trọn Đời (Mua 1 lần): <strong>399.000 ₫</strong></div>
          <div>• Gói Hàng Năm: <strong>199.000 ₫ / năm</strong></div>
          <div>• Gói Hàng Tháng: <strong>29.000 ₫ / tháng</strong></div>
        </div>
        <button class="btn" style="background:#F59E0B;color:#000;width:100%;padding:11px;" onclick="state.isPro=true;closeModal();render();showToast('🎉 Đã kích hoạt FinSmart Pro VIP!')"> Kích hoạt FinSmart Pro Ngay</button>
      `;
    }

    function openOCRModal() {
      state.accounts[0].balance -= 145000;
      state.transactions.unshift({ id: 'tx_' + Date.now(), amount: 145000, type: 'EXPENSE', date: '2026-10-25', note: 'Quét HĐ AI: Highlands Coffee', categoryId: 'cat1', sourceAccountId: 'acc1', eventId: '' });
      render();
      showToast('📸 Đã quét hóa đơn Highlands Coffee (145.000 ₫)!');
    }

    function openSplitBillModal() {
      const m = document.getElementById('modalContainer');
      m.classList.add('show');
      m.innerHTML = `
        <div class="row-between" style="margin-bottom:8px;"><span class="text-sm bold">🍕 Chia Tiền Nhóm</span><span style="cursor:pointer;" onclick="closeModal()">✕</span></div>
        <input id="sp_total" type="number" class="input" value="1200000" placeholder="Tổng hóa đơn (VND)" />
        <input id="sp_friends" type="text" class="input" value="Minh, Lan" placeholder="Tên các bạn (cách dấu phẩy)" />
        <button class="btn btn-blue" style="width:100%;padding:10px;" onclick="runSplit()">Chia Đều & Tự Tạo Sổ Nợ</button>
      `;
    }
    function runSplit() {
      const total = Number(document.getElementById('sp_total').value);
      const friends = document.getElementById('sp_friends').value.split(',').map(s => s.trim()).filter(Boolean);
      if (!total || !friends.length) return;
      const share = Math.round(total / (friends.length + 1));
      state.accounts[0].balance -= total;
      friends.forEach(f => state.debts.unshift({ id: 'd_' + Date.now() + Math.random(), person: f, type: 'LENT', total: share, paid: 0, due: '2026-11-10', note: 'Chia hóa đơn nhóm', settled: false }));
      closeModal();
      switchTab('debt');
      showToast(`🍕 Đã chia bill & tạo ${friends.length} khoản phải thu trong Sổ Nợ!`);
    }

    function openAdjustBalanceModal() {
      const acc = state.accounts[0];
      const m = document.getElementById('modalContainer');
      m.classList.add('show');
      m.innerHTML = `
        <div class="row-between" style="margin-bottom:8px;"><span class="text-sm bold">⚖️ Điều chỉnh số dư (${acc.name})</span><span style="cursor:pointer;" onclick="closeModal()">✕</span></div>
        <input id="adj_val" type="number" class="input" value="${acc.balance}" />
        <button class="btn btn-green" style="width:100%;padding:10px;" onclick="acc.balance=Number(document.getElementById('adj_val').value);closeModal();render();showToast('⚖️ Đã cân bằng số dư!')">Cập Nhật Số Dư</button>
      `;
    }

    function openDebtModal() {
      const m = document.getElementById('modalContainer');
      m.classList.add('show');
      m.innerHTML = `
        <div class="row-between" style="margin-bottom:8px;"><span class="text-sm bold">Thêm Vay / Cho Vay</span><span style="cursor:pointer;" onclick="closeModal()">✕</span></div>
        <select id="d_type" class="select"><option value="LENT">Cho vay (Phải thu)</option><option value="BORROWED">Đi vay (Phải trả)</option></select>
        <input id="d_person" type="text" class="input" placeholder="Tên người vay / Chủ nợ" />
        <input id="d_amt" type="number" class="input" placeholder="Số tiền (VND)" />
        <button class="btn btn-green" style="width:100%;padding:10px;" onclick="saveDebt()">Lưu Sổ Nợ</button>
      `;
    }
    function saveDebt() {
      const person = document.getElementById('d_person').value.trim();
      const total = Number(document.getElementById('d_amt').value);
      if (!person || !total) return;
      state.debts.unshift({ id: 'd_' + Date.now(), person, type: document.getElementById('d_type').value, total, paid: 0, due: '2026-12-30', note: '', settled: false });
      closeModal();
      render();
      showToast('Đã thêm vào Sổ nợ!');
    }
    function settleDebt(id) {
      const d = state.debts.find(x => x.id === id);
      if (d) { d.paid = d.total; d.settled = true; render(); showToast('✓ Đã tất toán xong!'); }
    }
    function payBill(id) {
      const b = state.bills.find(x => x.id === id);
      if (b) { b.paidThisMonth = true; state.accounts[1].balance -= b.amount; render(); showToast('✓ Đã thanh toán hóa đơn!'); }
    }
    function tryAddWallet() {
      if (!state.isPro && state.accounts.length >= 2) {
        showToast('🔒 Bản Free tối đa 2 Ví. Hãy bấm kích hoạt Pro!');
        openPaywallModal();
        return;
      }
      state.accounts.push({ id: 'acc_' + Date.now(), name: 'Ví MoMo', type: 'Ví điện tử', balance: 3000000, icon: '📱', excludeFromTotal: false });
      render();
    }

    render();
  </script>
</body>
</html>
